{% extends "base.html" %}
{% block title %}View Document{% endblock %}

{% block content %}
<div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1rem;">
  <a class="btn btn-secondary btn-sm" href="{{ back_url }}">&larr; Back to results</a>
  <span style="color:#888; font-size:0.85rem;">Result #{{ idx + 1 }}</span>
</div>

<div class="card">
  <h1 style="margin-bottom:0.3rem;">{{ doc.title() }}</h1>
  {% if doc.url() %}
    <p style="font-size:0.82rem; color:#888; margin-bottom:1rem;">Source: {{ doc.url() }}</p>
  {% endif %}
  <pre class="doc-body">{{ doc.body() }}</pre>
</div>

{% endblock %}
